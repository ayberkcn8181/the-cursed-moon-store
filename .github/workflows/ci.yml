name: CI
on:
  push:
    branches: [main, master]
  pull_request:

# ubuntu-latest ships libadwaita 1.5; gtk-rs libadwaita 0.8 needs >= 1.6.
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          dnf -y install \
            gcc gcc-c++ clang make git curl \
            pkgconf-pkg-config \
            gtk4-devel libadwaita-devel flatpak-devel flatpak \
            openssl-devel xz-devel xorg-x11-server-Xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Installed inventory GTK regression
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          tcms_xvfb_pid=$!
          trap 'kill "$tcms_xvfb_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            test -S /tmp/.X11-unix/X99 && break
            sleep 1
          done
          DISPLAY=:99 GSK_RENDERER=cairo cargo test --locked -p tcms-app installed_inventory_filters_virtualizes_and_opens_correct_package -- --ignored --test-threads=1
      - name: Flatpak preview aborts before deployment
        run: cargo test --locked -p tcms-flatpak preview_resolves_runtime_without_deploying -- --ignored --test-threads=1
      - name: Build
        run: cargo build -p tcms-app

  arch-smoke:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build tools
        run: pacman -Syu --noconfirm --needed rust git
      - uses: actions/checkout@v4
      - name: Real pacman fixture in isolated root
        env:
          TCMS_ARCH_SMOKE: '1'
        run: cargo test --locked -p tcms-pacman --test arch_smoke -- --ignored --nocapture
